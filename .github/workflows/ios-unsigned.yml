name: "Build iOS (unsigned IPA)"

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    build-ios:
        runs-on: macos-latest
        defaults:
            run:
                working-directory: mobile/apps/auth
        steps:
            - uses: actions/checkout@v4

            # The simple-icons submodule is not tracked in this repo. Pin it to the
            # same commit upstream Ente uses so the build doesn't pull whatever is
            # on simple-icons' main branch.
            - name: Fetch simple-icons
              env:
                  SIMPLE_ICONS_SHA: 6dcfdc2f58f6150d7b097b5cab158d27413f6366
              run: |
                  rm -rf assets/simple-icons
                  git init -q assets/simple-icons
                  git -C assets/simple-icons fetch -q --depth 1 https://github.com/simple-icons/simple-icons.git "$SIMPLE_ICONS_SHA"
                  git -C assets/simple-icons checkout -q FETCH_HEAD

            - name: Install Flutter
              uses: ./.github/actions/setup-flutter

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-ios

            - run: flutter pub get

            - name: Generate Rust bindings
              run: cargo codegen frb auth
              working-directory: ${{ github.workspace }}/rust

            - name: Install pods
              run: pod install
              working-directory: ${{ github.workspace }}/mobile/apps/auth/ios

            # Build via xcodebuild so the embedded watchOS target gets the right SDK
            # (`flutter build ios` forces the iphoneos SDK onto every target).
            - name: Flutter config only
              run: flutter build ios --config-only --release --no-codesign --dart-define=cronetHttpNoPlay=true

            - name: Archive (no codesign)
              run: |
                  xcodebuild archive \
                      -workspace ios/Runner.xcworkspace \
                      -scheme Runner \
                      -configuration Release \
                      -destination 'generic/platform=iOS' \
                      -archivePath build/ios/Runner.xcarchive \
                      CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

            - name: Package IPA
              run: |
                  mkdir -p Payload
                  cp -R build/ios/Runner.xcarchive/Products/Applications/*.app Payload/
                  ls Payload/*.app/Watch || true
                  zip -qr EnteAuth-unsigned.ipa Payload

            - uses: actions/upload-artifact@v4
              with:
                  name: EnteAuth-unsigned-ipa
                  path: mobile/apps/auth/EnteAuth-unsigned.ipa
